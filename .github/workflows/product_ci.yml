name: Android CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Make Gradle wrapper executable
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 5. Run unit tests
      - name: Run unit tests
        run: ./gradlew test

      # 6. Run lint
      - name: Run lint
        run: ./gradlew lint

      # 7. Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: product-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
